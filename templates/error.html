{% extends 'base.html' %}
{% block title %}{{ titulo }} · Rota Financeira{% endblock %}
{% block content %}
<section class="error-page" aria-labelledby="error-title"><a class="brand error-brand" href="{{ url_for('index') }}" aria-label="Rota Financeira, início"><img class="brand-logo brand-logo-light" src="{{ url_for('static', filename='img/logo-white.svg') }}" width="36" height="36" alt=""><img class="brand-logo brand-logo-dark" src="{{ url_for('static', filename='img/logo-black.svg') }}" width="36" height="36" alt=""><span>rota</span></a><span class="error-code">{{ codigo }}</span><h1 id="error-title">{{ titulo }}</h1><p>{{ mensagem }}</p><a class="button button-primary" href="{{ url_for('index') if session.get('usuario_id') else url_for('login') }}">Voltar para o início {{ icon('arrow-right') }}</a></section>
{% endblock %}
